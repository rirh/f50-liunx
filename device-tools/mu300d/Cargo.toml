[package]
name = "mu300d"
version = "0.1.0"
description = "MU300 device API daemon: one JSON API over the device tools in /opt/mu300/bin"
license = "MIT"
publish = false
rust-version = "1.87"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
libc = "0.2.191"
regex = { version = "1.13.1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "io-util", "time", "net", "sync", "signal"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
